name: CI - Build and Test

on:
  # Runs on all pull requests
  pull_request:
    branches: ['main']

  # Runs on pushes to main (before deploy)
  push:
    branches: ['main']

  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Cancel in-progress CI runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run linting
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test
        env:
          CI: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js site
        run: pnpm run build
        # Note: Do NOT set NEXT_PUBLIC_BASE_PATH here
        # The basePath is only needed for actual GitHub Pages deployment (in deploy.yml)
        # E2E tests need to run against a build without basePath since the test server
        # (serve -s out) doesn't understand basePath routing

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            .next/
            out/
          retention-days: 7

  link-check:
    name: Link check (soft-fail)
    runs-on: ubuntu-latest
    # The noise this was waiting on is now understood and fixed: the 13
    # standing failures were linkinator resolving extensionless routes
    # (`/about-us`) against a static export that emits `about-us.html`, plus
    # an `og:image` on a domain that was not live yet. `.linkinatorrc.json`
    # now rewrites origin-local extensionless URLs to their `.html` file, and
    # the check passes — scanning 129 links rather than 49, because it can
    # finally crawl into the pages themselves.
    #
    # Still soft-fail, but for a different reason than before: every
    # remaining failure mode is a third-party site being unreachable
    # (instagram.com, apps.apple.com, azdps.gov). `retry` covers a blip, not
    # an outage, and blocking a charity's merges on someone else's uptime is
    # not a trade worth making. Flip this if the external links are ever
    # skipped or vendored.
    continue-on-error: true
    # Kept as a separate job (not inside test-and-build) so it does not
    # multiply across the Playwright shard matrix introduced by #133.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js site
        run: pnpm run build

      - name: Check for broken links
        run: pnpm run check-links
